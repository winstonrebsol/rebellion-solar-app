<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
  
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RebSol Site Assessment">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<title>Rebellion Solar — Site Assessment</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root{
    --yellow:#FFCE3C;
    --ink:#1C1B18;
    --ink-soft:#5B5750;
    --paper:#FFFDF8;
    --card:#FFFFFF;
    --line:#E7E1D3;
    --orange:#E8792B;
    --good:#3E7B4F;
    --danger:#C0432B;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:96px;
  }
  header.top{
    position:sticky; top:0; z-index:20;
    background:var(--ink);
    color:#fff;
    padding:14px 16px 12px;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
  }
  header.top .brand{
    display:flex; align-items:baseline; gap:8px;
  }
  header.top .brand b{
    color:var(--yellow); font-size:17px; letter-spacing:.02em;
  }
  header.top .brand span{
    font-size:12px; color:#C9C4B8;
  }
  header.top .sub{
    margin-top:4px; font-size:13px; color:#D8D3C6;
  }
  nav.tabs{
    position:sticky; top:56px; z-index:19;
    display:flex; overflow-x:auto; gap:0;
    background:var(--ink);
    padding:0 4px 8px;
    -webkit-overflow-scrolling:touch;
  }
  nav.tabs button{
    flex:0 0 auto;
    border:none; background:transparent; color:#B8B2A3;
    font-size:13px; font-weight:600; padding:8px 14px;
    border-radius:999px; cursor:pointer; white-space:nowrap;
  }
  nav.tabs button.active{
    background:var(--yellow); color:var(--ink);
  }
  main{ padding:16px; max-width:640px; margin:0 auto; }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:14px;
  }
  .card h2{
    margin:0 0 4px; font-size:15px; text-transform:uppercase; letter-spacing:.06em;
    color:var(--orange);
  }
  .card p.hint{ margin:0 0 12px; font-size:13px; color:var(--ink-soft); }
  .field{ margin-bottom:12px; }
  .field label{
    display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:4px;
  }
  .field input[type=text], .field input[type=number], .field select, .field textarea{
    width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:10px;
    font-size:16px; background:#fff; color:var(--ink); font-family:inherit;
  }
  .field textarea{ resize:vertical; min-height:80px; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .appliance{
    border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:10px; background:#FFFCF5;
    position:relative;
  }
  .appliance .avg{
    margin-top:6px; font-size:13px; color:var(--good); font-weight:700;
  }
  .appliance .remove{
    position:absolute; top:8px; right:8px; background:none; border:none; color:var(--danger);
    font-size:12px; font-weight:700; cursor:pointer;
  }
  .grid3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  button.add{
    width:100%; padding:12px; border:2px dashed var(--orange); background:#FFF7EE; color:var(--orange);
    border-radius:10px; font-weight:700; font-size:14px; cursor:pointer;
  }
  button.add:disabled{ opacity:.4; cursor:not-allowed; }
  .summary-box{
    background:#FFF9E6; border:1px solid var(--yellow); border-radius:10px; padding:12px; margin-top:6px;
  }
  .summary-box .line{ display:flex; justify-content:space-between; font-size:13.5px; padding:4px 0; }
  .summary-box .line b{ font-size:14px; }
  .photo-slot{
    border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px; text-align:center; background:#FFFCF5;
  }
  .photo-slot h3{ margin:0 0 8px; font-size:14px; }
  .photo-slot img{
    max-width:100%; max-height:260px; border-radius:8px; display:block; margin:0 auto 10px; border:1px solid var(--line);
  }
  .photo-slot .placeholder{
    height:140px; border:2px dashed var(--line); border-radius:8px; display:flex; align-items:center; justify-content:center;
    color:var(--ink-soft); font-size:13px; margin-bottom:10px;
  }
  .btn{
    display:inline-block; padding:10px 16px; border-radius:999px; border:none; font-weight:700; font-size:13.5px; cursor:pointer;
  }
  .btn-primary{ background:var(--ink); color:#fff; }
  .btn-outline{ background:#fff; border:1px solid var(--line); color:var(--ink); }
  .btn-yellow{ background:var(--yellow); color:var(--ink); }
  footer.bar{
    position:fixed; bottom:0; left:0; right:0; z-index:30;
    background:#fff; border-top:1px solid var(--line);
    padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    display:flex; align-items:center; gap:10px;
  }
  footer.bar .status{ flex:1; font-size:12px; color:var(--ink-soft); }
  footer.bar button{
    padding:13px 18px; border-radius:999px; border:none; background:var(--orange); color:#fff;
    font-weight:800; font-size:14.5px; cursor:pointer; flex-shrink:0;
  }
  footer.bar button:disabled{ opacity:.5; }
  .toast{
    position:fixed; bottom:78px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:#fff; padding:10px 16px; border-radius:999px; font-size:13px;
    opacity:0; pointer-events:none; transition:opacity .25s; z-index:40; white-space:nowrap;
  }
  .toast.show{ opacity:1; }
  .newbtn{ background:none; border:none; color:#D8D3C6; font-size:12px; text-decoration:underline; cursor:pointer; padding:0; }
</style>
</head>
<body>

<header class="top">
  <div class="brand"><b>REBELLION SOLAR</b><span>Site Assessment</span></div>
  <div class="sub" id="headerSub">New assessment — fill in the tabs below</div>
</header>

<nav class="tabs" id="tabs"></nav>

<main id="main"></main>

<div class="toast" id="toast"></div>

<footer class="bar">
  <div class="status" id="status">Draft autosaves on this phone</div>
  <button class="newbtn" id="newBtn" style="margin-right:6px;">Start new</button>
  <button id="generateBtn">Generate Word file</button>
</footer>

const MEDIA = {
  meter: "word/media/ff5bcdc03fd00929b3c8bc946724c6971d3a68e6.jpg",
  house: "word/media/85a15aaf18fe4dc361d7d679f68cf54ab502f031.jpg",
  roof:  "word/media/e72b5de971bf6553b446a7c446047bd1c9fbb49c.jpg"
};

const TABS = ["Info","Energy Usage","Roof","Notes","Photos"];
let activeTab = 0;

const state = {
  assessor:"", date:"", client:"", refNo:"", address:"", room:"",
  appliances: Array.from({length:11}, () => ({name:"",acdc:"",qty:"",watt:"",hrs:"",days:""})),
  rowCount: 4,
  highestAC:"", totalACConn:"", loadFactor:"",
  avgDailyWh:"", avgMonthlyBill:"",
  roofDir:"", azimuth:"", roofSlope:"", roofMaterial:"", roofAge:"", roofCondition:"",
  roofSpace:"", rafterMaterial:"", ladderAccess:"", atticAccess:"", overheadLines:"", roofOtherObs:"",
  notes:"",
  photos: { meter:null, house:null, roof:null } // {dataUrl, blob}
};

function esc(v){
  return (v||"").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function num(v){ const n=parseFloat(v); return isNaN(n)?0:n; }

function applianceAvg(a){ return num(a.qty)*num(a.watt)*num(a.hrs); }

function totals(){
  let total=0;
  for(let i=0;i<state.rowCount;i++){ total += applianceAvg(state.appliances[i]); }
  const corrected = state.loadFactor ? total*num(state.loadFactor) : "";
  return { total, corrected };
}

// ---------- storage (autosave) ----------
let saveTimer=null;
function scheduleSave(){
  clearTimeout(saveTimer);
  document.getElementById('status').textContent = "Saving…";
  saveTimer=setTimeout(async ()=>{
    try{
      const {photos, ...rest} = state;
      await window.storage.set('draft-fields', JSON.stringify(rest), false);
      document.getElementById('status').textContent = "Draft saved to this phone";
    }catch(e){
      document.getElementById('status').textContent = "Autosave unavailable";
    }
  }, 500);
}
async function savePhotos(){
  try{
    const out = {};
    for(const k of Object.keys(state.photos)){
      out[k] = state.photos[k] ? state.photos[k].dataUrl : null;
    }
    await window.storage.set('draft-photos', JSON.stringify(out), false);
  }catch(e){}
}
async function loadDraft(){
  try{
    const f = await window.storage.get('draft-fields', false);
    if(f && f.value){
      const obj = JSON.parse(f.value);
      Object.assign(state, obj);
    }
  }catch(e){}
  try{
    const p = await window.storage.get('draft-photos', false);
    if(p && p.value){
      const obj = JSON.parse(p.value);
      for(const k of Object.keys(obj)){
        if(obj[k]){
          const blob = await (await fetch(obj[k])).blob();
          state.photos[k] = { dataUrl: obj[k], blob };
        }
      }
    }
  }catch(e){}
}

// ---------- rendering ----------
function renderTabs(){
  const nav = document.getElementById('tabs');
  nav.innerHTML = "";
  TABS.forEach((t,i)=>{
    const b = document.createElement('button');
    b.textContent = t;
    if(i===activeTab) b.className="active";
    b.onclick = ()=>{ activeTab=i; render(); };
    nav.appendChild(b);
  });
}

function fieldHTML(id,label,value,type,opts){
  opts = opts||{};
  if(type==="textarea"){
  const rows = opts.rows || 5;
  return `<div class="field">
    <label>${label}</label>
    <textarea id="${id}" rows="${rows}" placeholder="${opts.placeholder||''}">${esc(value)}</textarea>
  </div>`;
}
  return `<div class="field"><label>${label}</label><input type="${type||'text'}" id="${id}" value="${esc(value)}" placeholder="${opts.placeholder||''}"></div>`;
}

function renderInfoTab(){
  return `
  <div class="card">
    <h2>Assessment Info</h2>
    <p class="hint">Shared across the Energy Usage and Site Assessment pages of the report.</p>
    <div class="row2">
      ${fieldHTML('assessor','Name of Assessor',state.assessor)}
      ${fieldHTML('date','Date of Visit',state.date,'text',{placeholder:'MM/DD/YYYY'})}
    </div>
    <div class="row2">
      ${fieldHTML('client','Client Name',state.client)}
      ${fieldHTML('refNo','Ref. No.',state.refNo)}
    </div>
    ${fieldHTML('address','Address',state.address)}
    ${fieldHTML('room','Room / Area being assessed',state.room,'text',{placeholder:'e.g. Whole house, Main panel area'})}
  </div>
  <div class="card">
    <h2>Client-reported usage</h2>
    <div class="row2">
      ${fieldHTML('avgDailyWh','Ave. Daily Watt-Hour Consumption',state.avgDailyWh,'text')}
      ${fieldHTML('avgMonthlyBill','Ave. Monthly Electric Bill',state.avgMonthlyBill,'text')}
    </div>
  </div>`;
}

function renderApplianceCard(a,i){
  const avg = applianceAvg(a);
  return `
  <div class="appliance" data-idx="${i}">
    ${i>3 ? `<button class="remove" data-remove="${i}">Remove</button>`:''}
    <div class="field" style="margin-bottom:8px;">
      <label>Appliance</label>
      <input type="text" data-f="name" data-i="${i}" value="${esc(a.name)}" placeholder="e.g. Refrigerator">
    </div>
    <div class="grid3">
      <div class="field">
        <label>AC/DC</label>
        <select data-f="acdc" data-i="${i}">
          <option value="" ${a.acdc===''?'selected':''}></option>
          <option value="AC" ${a.acdc==='AC'?'selected':''}>AC</option>
          <option value="DC" ${a.acdc==='DC'?'selected':''}>DC</option>
        </select>
      </div>
      <div class="field"><label>Qty</label><input type="number" inputmode="decimal" data-f="qty" data-i="${i}" value="${esc(a.qty)}"></div>
      <div class="field"><label>Wattage</label><input type="number" inputmode="decimal" data-f="watt" data-i="${i}" value="${esc(a.watt)}"></div>
    </div>
    <div class="grid2">
      <div class="field"><label>Hours per day</label><input type="number" inputmode="decimal" data-f="hrs" data-i="${i}" value="${esc(a.hrs)}"></div>
      <div class="field"><label>Days per week</label><input type="number" inputmode="decimal" data-f="days" data-i="${i}" value="${esc(a.days)}"></div>
    </div>
    <div class="avg">Ave. watt-hour/day: ${avg?avg.toFixed(1):'—'}</div>
  </div>`;
}

function renderEnergyTab(){
  let rows = "";
  for(let i=0;i<state.rowCount;i++){ rows += renderApplianceCard(state.appliances[i], i); }
  const {total, corrected} = totals();
  return `
  <div class="card">
    <h2>Appliances</h2>
    <p class="hint">Add every appliance the client runs. Ave. watt-hour/day is calculated automatically.</p>
    ${rows}
    <button class="add" id="addRow" ${state.rowCount>=11?'disabled':''}>${state.rowCount>=11?'Maximum 11 appliances':'+ Add appliance'}</button>
  </div>
  <div class="card">
    <h2>Load Summary</h2>
    <div class="row2">
      ${fieldHTML('highestAC','Highest AC load in watts',state.highestAC,'number')}
      ${fieldHTML('totalACConn','Total AC connected wattage at one time',state.totalACConn,'number')}
    </div>
    ${fieldHTML('loadFactor','Load correction factor',state.loadFactor,'number',{placeholder:'e.g. 1.3'})}
    <div class="summary-box">
      <div class="line"><span>Total watt-hour per day</span><b>${total.toFixed(1)}</b></div>
      <div class="line"><span>Corrected watt-hour per day</span><b>${corrected===""?"—":corrected.toFixed(1)}</b></div>
    </div>
  </div>`;
}

function renderRoofTab(){
  return `
  <div class="card">
    <h2>Roof Assessment</h2>
    <div class="row2">
      ${fieldHTML('roofDir','Direction the roof faces',state.roofDir)}

function renderNotesTab(){
  return `
  <div class="card">
    <h2>Notes</h2>
    <p class="hint">Document Wi-Fi assessment, ground conditions, system calculations, site challenges, and any additional observations relevant to the installation.</p>
    ${fieldHTML('notes','Notes',state.notes,'textarea',{
  rows:30,
  placeholder:'Wi-Fi signal strength, ground conditions, site challenges, access notes, installation concerns, computation remarks, or any other observations...'
})}

}

function photoSlotHTML(key,label){
  const p = state.photos[key];
  return `
  <div class="photo-slot">

    ${p ? `<img src="${p.dataUrl}">` : `<div class="placeholder">No photo yet</div>`}

  return `
  <div class="card">
    <h2>Photos</h2>

function render(){
  renderTabs();
  const main = document.getElementById('main');
  const renderers = [renderInfoTab, renderEnergyTab, renderRoofTab, renderNotesTab, renderPhotosTab];
  main.innerHTML = renderers[activeTab]();
  document.getElementById('headerSub').textContent = state.client ? `Assessment for ${state.client}` : "New assessment — fill in the tabs below";
  bindEvents();
}

function bindEvents(){
  main_bindSimpleFields();
  if(activeTab===1){
    document.querySelectorAll('[data-f]').forEach(el=>{
      el.addEventListener('input', e=>{
        const i = +el.dataset.i, f = el.dataset.f;
        state.appliances[i][f] = el.value;
        // live-update avg + totals without full re-render (keep focus)
        const card = el.closest('.appliance');
        const avgVal = applianceAvg(state.appliances[i]);
        card.querySelector('.avg').textContent = 'Ave. watt-hour/day: ' + (avgVal?avgVal.toFixed(1):'—');
        const {total,corrected} = totals();
        const box = document.querySelectorAll('.summary-box .line b');
        if(box[0]) box[0].textContent = total.toFixed(1);
        if(box[1]) box[1].textContent = corrected===""?"—":corrected.toFixed(1);
        scheduleSave();
      });
    });
    const addBtn = document.getElementById('addRow');
    if(addBtn) addBtn.addEventListener('click', ()=>{
      if(state.rowCount<11){ state.rowCount++; render(); scheduleSave(); }
    });
    document.querySelectorAll('[data-remove]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const idx = +el.dataset.remove;
        // shift rows down to fill gap, clear last
        for(let i=idx;i<state.rowCount-1;i++){ state.appliances[i] = state.appliances[i+1]; }
        state.appliances[state.rowCount-1] = {name:"",acdc:"",qty:"",watt:"",hrs:"",days:""};
        state.rowCount--;
        render(); scheduleSave();
      });
    });
  }
  if(activeTab===4){
    ['mdp','house','roof','bill'].forEach(key=>
      const btn = document.querySelector(`[data-take="${key}"]`);
      const input = document.getElementById(`file-${key}`);
      if(btn) btn.addEventListener('click', ()=> input.click());
      if(input) input.addEventListener('change', async (e)=>{
        const file = e.target.files[0];
        if(!file) return;
        showToast('Processing photo…');
        try{
          const {dataUrl, blob} = await compressImage(file);
          state.photos[key] = { dataUrl, blob };
          await savePhotos();
          render();
          activeTab = 4;
          showToast('Photo saved');
        }catch(err){
          showToast('Could not process photo');
        }
      });
    });
  }
}

// ---------- image compression ----------
async function compressImage(file){
  let bitmap;
  try{
    bitmap = await createImageBitmap(file, { imageOrientation: 'from-image' });
  }catch(e){
    bitmap = await createImageBitmap(file);
  }
  const maxDim = 1600;
  let {width,height} = bitmap;
  if(width>height && width>maxDim){ height = Math.round(height*maxDim/width); width=maxDim; }
  else if(height>=width && height>maxDim){ width = Math.round(width*maxDim/height); height=maxDim; }
  const canvas = document.createElement('canvas');
  canvas.width=width; canvas.height=height;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(bitmap,0,0,width,height);
  const blob = await new Promise(res=> canvas.toBlob(res,'image/jpeg',0.82));
  const dataUrl = await new Promise(res=>{
    const r = new FileReader();
    r.onload = ()=>res(r.result);
    r.readAsDataURL(blob);
  });
  return {dataUrl, blob};
}

  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove('show'), 2200);

// ---------- docx generation ----------
function base64ToUint8Array(b64){
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
  return bytes;
}

function multilineReplacement(value){
  const lines = (value||"").split(/\r?\n/);
  return lines.map(esc).join('</w:t></w:r><w:r><w:br/></w:r><w:r><w:t xml:space="preserve">');
}

function buildTokenMap(){
  const {total, corrected} = totals();
  const map = {
    ASSESSOR: esc(state.assessor), DATE: esc(state.date), CLIENT: esc(state.client),
    REF_NO: esc(state.refNo), ADDRESS: esc(state.address), ROOM: esc(state.room),
    AVG_DAILY_WH: esc(state.avgDailyWh), AVG_MONTHLY_BILL: esc(state.avgMonthlyBill),
    HIGHEST_AC: esc(state.highestAC), TOTAL_AC_CONN: esc(state.totalACConn),
    LOAD_FACTOR: esc(state.loadFactor), TOTAL_WH: total?total.toFixed(1):"",
    CORRECTED_WH: corrected===""?"":corrected.toFixed(1),
    ROOF_DIR: esc(state.roofDir), AZIMUTH: esc(state.azimuth), ROOF_SLOPE: esc(state.roofSlope),
    ROOF_MATERIAL: esc(state.roofMaterial), ROOF_AGE: esc(state.roofAge), ROOF_CONDITION: esc(state.roofCondition),
    ROOF_SPACE: esc(state.roofSpace), RAFTER_MATERIAL: esc(state.rafterMaterial),
    LADDER_ACCESS: esc(state.ladderAccess), ATTIC_ACCESS: esc(state.atticAccess),
    OVERHEAD_LINES: esc(state.overheadLines),
  };
  for(let i=1;i<=11;i++){
    const a = state.appliances[i-1] || {name:"",acdc:"",qty:"",watt:"",hrs:"",days:""};
    const avg = applianceAvg(a);
    map[`A${i}_NAME`] = esc(a.name);
    map[`A${i}_ACDC`] = esc(a.acdc);
    map[`A${i}_QTY`] = esc(a.qty);
    map[`A${i}_WATT`] = esc(a.watt);
    map[`A${i}_HRS`] = esc(a.hrs);
    map[`A${i}_DAYS`] = esc(a.days);
    map[`A${i}_AVG`] = avg ? avg.toFixed(1) : "";
  }
  return map;
}

async function generateDocx(){
  if(typeof JSZip === 'undefined'){
    showToast('Could not load document engine — check your connection');
    return;
  }
  const btn = document.getElementById('generateBtn');
  btn.disabled = true; btn.textContent = 'Generating…';
  try{
    const templateBytes = base64ToUint8Array(TEMPLATE_B64);
    const zip = await JSZip.loadAsync(templateBytes);
    let xml = await zip.file('word/document.xml').async('string');

    const map = buildTokenMap();
    Object.keys(map).forEach(key=>{
      const token = `{{${key}}}`;
      if(xml.indexOf(token)===-1) return;
      xml = xml.split(token).join(map[key]);
    });
    // multiline-capable fields
    xml = xml.split('{{NOTES}}').join(multilineReplacement(state.notes));
    xml = xml.split('{{ROOF_OTHER_OBS}}').join(multilineReplacement(state.roofOtherObs));
    // in case ROOF_OTHER_OBS token was already consumed by generic pass above, guard:
    zip.file('word/document.xml', xml);

    for(const key of ['meter','house','roof']){
      const p = state.photos[key];
      if(p){
        const buf = new Uint8Array(await p.blob.arrayBuffer());
        zip.file(MEDIA[key], buf);
      }
    }

    const blob = await zip.generateAsync({
      type:'blob',
      mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
    });
    const clientPart = (state.client||'Site_Assessment').trim().replace(/[^a-z0-9]+/gi,'_');
    const fname = `${clientPart}_Rebellion_Solar_Assessment.docx`;
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = fname;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 5000);
    showToast('Word file downloaded');
  }catch(e){
    console.error(e);
    showToast('Something went wrong generating the file');
  }finally{
    btn.disabled=false; btn.textContent='Generate Word file';
  }
}

document.getElementById('generateBtn').addEventListener('click', generateDocx);
